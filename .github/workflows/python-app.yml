  update-versions:
    # Токену нужен доступ на запись, иначе git push отклоняется
    permissions:
      contents: write

    # Параллельные запуски не должны толкаться в один и тот же versions.md
    concurrency:
      group: versions-md
      cancel-in-progress: false

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append commit to versions.md
        env:
          COMMIT_HASH: ${{ github.event.head_commit.id }}
          COMMIT_DATE: ${{ github.event.head_commit.timestamp }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
        run: |
          COMMIT_MSG="${COMMIT_MSG%%$'\n'*}"   # только первая строка сообщения

          # Пропускаем собственные коммиты бота
          if [ "${COMMIT_MSG#chore: update versions.md}" != "$COMMIT_MSG" ]; then
            echo "Commit created by the workflow, nothing to add"
            exit 0
          fi

          # Не дублируем уже записанный хеш
          if [ -f versions.md ] && grep -q "$COMMIT_HASH" versions.md; then
            echo "Commit $COMMIT_HASH already recorded"
            exit 0
          fi

          echo "- ${COMMIT_DATE} ${COMMIT_HASH} ${COMMIT_MSG}" >> versions.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.md
          git commit -m "chore: update versions.md [skip ci]"

          # checkout оставляет detached HEAD, поэтому refspec указываем явно
          git push origin "HEAD:refs/heads/${BRANCH}"
